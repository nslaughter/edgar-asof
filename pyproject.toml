[project]
name = "edgar-asof"
# The release is T9's, in docs/plan.md, which also gives the rest of the
# package's metadata.
version = "0.1.0.dev0"
description = "What a company reported to the SEC, as it was known at any past time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/nslaughter/edgar-asof"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2",
    "pytest>=9",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
# Ruff would also format the Python in Markdown code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    # tests/test_network_guard.py runs the guard in tests/conftest.py.
    "-p",
    "pytester",
]
xfail_strict = true
markers = ["spec(*ids): the spec/*.md statements a test checks"]
filterwarnings = ["error"]
